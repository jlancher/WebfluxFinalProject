name: webflux-customer-final

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command:
      - start-dev
      - --import-realm
      - --hostname=http://localhost:8180
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Copia .env.example a .env}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/customer-final-realm.json:/opt/keycloak/data/import/customer-final-realm.json:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.1
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Copia .env.example a .env}
      GF_SERVER_ROOT_URL: http://localhost:3001/
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped

volumes:
  keycloak_data:
  prometheus_data:
  grafana_data:
