global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # La aplicación Spring Boot corre en Windows, NO dentro de Compose.
  # host.docker.internal es resoluble en Docker Desktop para Windows.
  - job_name: customer-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['100.97.130.111:8083']
        labels:
          course: webflux-final
